<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yuttikorn Wuttiprapagit | Production Engineering & Asset Reliability</title>
  <!-- Google Fonts & Lucide Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-base: #0B0F19;
      --bg-surface: #111827;
      --bg-card: #1F2937;
      --border-subtle: #374151;
      --border-glow: #1E3A8A;
      
      --text-main: #F9FAFB;
      --text-muted: #9CA3AF;
      --text-dim: #6B7280;
      
      --accent-blue: #38BDF8;
      --accent-navy: #1D4ED8;
      --accent-emerald: #10B981;
      --accent-amber: #F59E0B;
      --accent-purple: #8B5CF6;
      
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-card: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      line-height: 1.6;
      padding: 24px;
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(29, 78, 216, 0.12) 0px, transparent 50%);
      background-attachment: fixed;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* TOP BAR / HEADER */
    .header-card {
      background: linear-gradient(135deg, rgba(31, 41, 55, 0.9) 0%, rgba(17, 24, 39, 0.95) 100%);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 32px;
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow-card);
      position: relative;
      overflow: hidden;
    }

    .header-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-emerald), var(--accent-purple));
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 24px;
    }

    .profile-group {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .avatar-wrapper {
      position: relative;
      width: 105px;
      height: 125px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, #1E293B, #0F172A);
      border: 2px solid var(--accent-blue);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.3);
      overflow: hidden;
      flex-shrink: 0;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
      transition: transform 0.3s ease;
    }

    .avatar-wrapper:hover .avatar-img {
      transform: scale(1.05);
    }

    .name-title h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .badge-verified {
      font-size: 0.75rem;
      padding: 4px 10px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--accent-emerald);
      color: var(--accent-emerald);
      border-radius: 999px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .name-title p {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent-blue);
      margin-top: 4px;
    }

    .contact-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255, 255, 255, 0.08);
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .chip:hover {
      color: #FFFFFF;
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--accent-blue);
    }

    .header-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: flex-end;
    }

    .btn-action {
      background: linear-gradient(135deg, var(--accent-navy), var(--accent-blue));
      color: #FFFFFF;
      border: none;
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
    }

    /* EXECUTIVE SUMMARY BANNER */
    .summary-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 20px 24px;
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.7;
    }

    .summary-card b {
      color: #FFFFFF;
    }

    /* KPI METRICS GRID */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .kpi-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 20px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
      position: relative;
      transition: all 0.25s ease;
    }

    .kpi-card:hover {
      border-color: var(--accent-blue);
      transform: translateY(-3px);
      background: #172033;
    }

    .kpi-icon {
      padding: 12px;
      border-radius: var(--radius-sm);
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent-blue);
    }

    .kpi-card.emerald .kpi-icon { background: rgba(16, 185, 129, 0.1); color: var(--accent-emerald); }
    .kpi-card.amber .kpi-icon { background: rgba(245, 158, 11, 0.1); color: var(--accent-amber); }
